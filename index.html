<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samson Trading Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #ff444f; /* Deriv red theme */
            text-align: center;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            box-sizing: border-box;
            background-color: #2a2a2a;
            color: #fff;
        }
        button {
            background-color: #ff444f;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e03a44;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            background-color: #2a2a2a;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Samson Trading Bot</h1>

        <div class="form-group">
            <label for="appId">App ID:</label>
         
<input type="text" id="appId" value="34svU14NaRFfYSTDUJ2hm">(I.e.,
        </div>
        <div class="form-group">
            <label for="apiToken">API Token (Demo or Real):</label>
            <input type="password" id="apiToken" placeholder="Enter your Deriv API token">
        </div>

        <button onclick="connectAndAuthorize()">Connect & Authorize</button>

        <div class="form-group" style="margin-top: 20px;">
            <label>Connection Logs:</label>
            <div id="status">Ready to connect...</div>
        </div>
    </div>

    <script>
        let ws;

        function log(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent += '\n' + message;
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }

        function connectAndAuthorize() {
            const appId = document.getElementById('appId').value.trim();
            const token = document.getElementById('apiToken').value.trim();

            if (!appId || !token) {
                alert('Please enter both an App ID and an API Token.');
                return;
            }

            log(`Connecting to WebSocket with App ID: ${appId}...`);

            // Connect to Deriv WebSocket API
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);

            ws.onopen = function () {
                log('WebSocket connected. Sending authorization token...');
                // Send authorization request
                ws.send(JSON.stringify({ authorize: token }));
            };

            ws.onmessage = function (event) {
                const data = JSON.parse(event.data);

                if (data.msg_type === 'authorize') {
                    if (data.error) {
                        log(`Error: ${data.error.message}`);
                    } else {
                        const account = data.authorize;
                        const isDemo = account.loginid.startsWith('VRTC');
                        
                        log('-----------------------------------');
                        log(`Authorized successfully!`);
                        log(`Account ID: ${account.loginid}`);
                        log(`Account Type: ${isDemo ? 'DEMO ACCOUNT' : 'REAL ACCOUNT'}`);
                        log(`Balance: ${account.balance} ${account.currency}`);
                        log('-----------------------------------');
                    }
                }
            };

            ws.onerror = function (error) {
                log('WebSocket Error encountered.');
            };

            ws.onclose = function () {
                log('Connection closed.');
            };
        }
    </script>
</body>
</html>
